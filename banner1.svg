<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<defs>
  <radialGradient id="glow" cx="50%" cy="42%" r="60%">
    <stop offset="0%" stop-color="#3a220a" stop-opacity="0.55"/>
    <stop offset="45%" stop-color="#160f06" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d0d0d"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <pattern id="diag" width="60" height="60" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
