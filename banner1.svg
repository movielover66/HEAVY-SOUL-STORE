    <line x1="0" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-opacity="0.02" stroke-width="18"/>
  </pattern>
</defs>
<rect width="1600" height="700" fill="url(#base)"/>
<rect width="1600" height="700" fill="url(#diag)"/>
