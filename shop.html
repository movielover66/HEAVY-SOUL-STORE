<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | HEAVY SOUL</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/logo/favicon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<style>
.shop-header{padding:120px 6% 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.shop-controls{display:flex;gap:10px;flex-wrap:wrap;}
.search-box,.category-select{padding:13px;border:none;border-radius:8px;outline:none;font-size:15px;background:var(--card);color:#fff;border:1px solid #333;}
.search-box{width:260px;}
</style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">
    <img src="assets/logo/logo-icon-160.png" alt="Heavy Soul">
    HEAVY SOUL
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="track.html">Track Order</a>
    <a href="policy.html">Policy</a>
  </nav>
  <div class="nav-icons"><a href="cart.html">🛒</a></div>
</header>

<section class="shop-header">
  <h1>All Products</h1>
  <div class="shop-controls">
    <input type="text" id="searchInput" class="search-box" placeholder="Search Products...">
    <select id="categoryFilter" class="category-select">
      <option value="all">All Categories</option>
      <option value="Bike">Bike</option>
      <option value="Street">Street</option>
    </select>
  </div>
</section>

<section>
  <div class="products" id="shopProducts" style="padding:0 6% 80px;"></div>
</section>

<script src="js/products.js"></script>
<script>
const grid = document.getElementById("shopProducts");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");

function renderCard(product){
  return `
    <div class="card">
      ${product.badge ? `<span class="badge-chip">${product.badge}</span>` : ""}
      <a href="product.html?id=${product.id}"><img src="${product.image}" alt="${product.name}"></a>
      <div class="card-content">
        <div class="card-title">${product.name}</div>
        <div class="price">₹${product.price}</div>
        <a href="product.html?id=${product.id}" class="buy-btn">View Details</a>
      </div>
    </div>
  `;
}

function renderProducts(list){
  grid.innerHTML = list.length ? list.map(renderCard).join("") : `<p style="grid-column:1/-1;text-align:center;color:#888;">No products found.</p>`;
}

function filterProducts(){
  const keyword = searchInput.value.toLowerCase();
  const category = categoryFilter.value;
  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(keyword) &&
    (category === "all" || p.category === category)
  );
  renderProducts(filtered);
}

// Pre-select category from URL (?category=Bike) coming from homepage collection links
const urlCategory = new URLSearchParams(window.location.search).get("category");
if (urlCategory) categoryFilter.value = urlCategory;

searchInput.addEventListener("keyup", filterProducts);
categoryFilter.addEventListener("change", filterProducts);

filterProducts();
</script>
