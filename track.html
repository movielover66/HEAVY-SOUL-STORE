<style>
.track-container{max-width:600px;margin:130px auto 70px;padding:0 20px;}
.track-container h1{
  font-family:'Anton',Arial,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:1px;
  font-size:36px;text-align:center;margin-bottom:10px;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.track-form{display:flex;gap:10px;margin:26px 0 32px;flex-wrap:wrap;}
.track-form input{flex:1;padding:14px;border-radius:8px;border:1px solid #333;background:var(--card);color:#fff;min-width:180px;font-family:inherit;}
.track-form input:focus{outline:2px solid var(--orange);}
.track-form button{padding:14px 26px;background:var(--grad);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;}
.track-msg{color:#999;text-align:center;padding:20px 0;}
.track-msg.error{color:#ff6666;}
.track-card{background:var(--card);border-radius:14px;padding:26px;border:1px solid rgba(255,255,255,.06);}
.track-order-id{margin-bottom:18px;color:#ccc;font-size:15px;}
.track-live-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(245,148,10,.12);border:1px solid rgba(245,148,10,.35);color:var(--orange);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:5px 12px;border-radius:20px;margin-bottom:20px;}
.track-live-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:trackPulseDot 1.4s ease-in-out infinite;}
.track-customer{background:var(--card-2);border-radius:10px;padding:16px 18px;margin-bottom:22px;border:1px solid rgba(255,255,255,.05);}
.track-customer p{color:#aaa;font-size:14px;line-height:1.9;margin:0;}
.track-customer p b{color:#fff;font-weight:600;}
.track-timeline{display:flex;flex-direction:column;padding-left:6px;}
.track-step{display:flex;align-items:center;gap:14px;padding:10px 0;position:relative;}
.track-step .dot{width:26px;height:26px;border-radius:50%;background:#1c1c1c;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:#666;z-index:1;box-sizing:border-box;}
.track-step.done .dot{background:var(--grad);border-color:transparent;color:#fff;}
.track-step.current .dot{animation:trackPulseRing 1.6s ease-out infinite;}
.track-step .label{color:#888;font-weight:600;}
.track-step.done .label{color:#fff;}
.track-step.current .label{color:var(--orange);}
.track-step:not(:last-child)::after{content:"";position:absolute;left:12px;top:30px;width:2px;height:calc(100% - 4px);background:#333;}
.track-step.done:not(:last-child)::after{background:var(--orange);}
.track-link-btn{display:block;text-align:center;margin-top:22px;}
@keyframes trackPulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
@keyframes trackPulseRing{0%{box-shadow:0 0 0 0 rgba(245,148,10,.55);}70%{box-shadow:0 0 0 10px rgba(245,148,10,0);}100%{box-shadow:0 0 0 0 rgba(245,148,10,0);}}
</style>
</head>

  <form id="trackForm" class="track-form">
    <input type="text" id="orderIdInput" placeholder="e.g. HS-20260719-042" required>
    <button type="submit">Track</button>
  </form>
